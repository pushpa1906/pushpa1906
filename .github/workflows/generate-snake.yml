name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate green contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pushpa1906
          outputs: |
            dist/github-snake.svg?color_snake=%2339D353&color_dots=%2318121F,%238B5E9F,%23C9B6E4,%2339D353,%23F7F3FF
            dist/github-snake-dark.svg?color_snake=%2339D353&color_dots=%2318121F,%238B5E9F,%23C9B6E4,%2339D353,%23F7F3FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
